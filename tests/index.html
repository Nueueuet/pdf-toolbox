<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PDF Toolbox — tests</title>
  <!--
    The grid tests drive real elements, so they need the real stylesheet: without
    it the cards have no layout and every split mark collapses onto the same
    point, which makes a gesture test pass or fail for the wrong reasons.
  -->
  <link rel="stylesheet" href="../app/styles.css">
  <style>
    body { font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; margin: 32px; color: #16202a; background: #fff; height: auto; }
    h1 { font-size: 20px; margin: 0 0 4px; }
    p.sub { color: #5b6b7a; margin: 0 0 20px; }
    ol { padding-left: 0; list-style: none; }
    li { padding: 8px 12px; border-bottom: 1px solid #eef2f6; display: flex; gap: 12px; align-items: baseline; }
    .mark { width: 18px; font-weight: 700; }
    .ok .mark { color: #16a34a; }
    .fail .mark { color: #dc2626; }
    .name { flex: 1; }
    .ms { color: #8c9bab; font-variant-numeric: tabular-nums; }
    .err { display: block; color: #dc2626; font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; margin-top: 4px; }
    #summary { margin-top: 18px; font-weight: 700; }
  </style>
</head>
<body>
  <h1>PDF Toolbox tests</h1>
  <p class="sub">Round-trip checks: every case writes a real PDF, reads it back and compares it with the preview.</p>
  <ol id="list"></ol>
  <div id="summary">Running…</div>

  <script type="module" src="run.js"></script>
</body>
</html>
