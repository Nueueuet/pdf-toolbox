<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PDF Toolbox</title>
  <link rel="icon" href="../icons/icon48.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <div class="topbar__brand">
        <img class="topbar__logo" src="../icons/icon48.png" alt="">
        <span class="topbar__name">PDF Toolbox</span>
      </div>

      <div class="topbar__doc" id="docBar" hidden>
        <input class="topbar__title" id="docTitle" aria-label="Document name" spellcheck="false">
        <span class="topbar__meta" id="docMeta"></span>
      </div>

      <div class="topbar__actions" id="topActions" hidden>
        <button class="btn btn--icon" id="undoBtn" title="Undo (Ctrl+Z)" aria-label="Undo">↶</button>
        <button class="btn btn--icon" id="redoBtn" title="Redo (Ctrl+Shift+Z)" aria-label="Redo">↷</button>
        <button class="btn" id="addFilesBtn">Add files</button>
        <button class="btn btn--danger" id="clearAllBtn"
                title="Close everything and start over">Start over</button>
        <button class="btn btn--primary" id="exportBtn">Save PDF</button>
      </div>

      <!-- Outside the document actions, so they are reachable on the empty screen too. -->
      <div class="topbar__view">
        <button class="btn btn--icon" id="compactBtn" aria-pressed="false"
                title="Collapse the side panels" aria-label="Collapse the side panels">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M9 4v16"/>
            <path d="M15 10l-2 2 2 2"/>
          </svg>
        </button>
        <button class="btn btn--icon" id="fullscreenBtn" aria-pressed="false"
                title="Full screen (F11)" aria-label="Full screen">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
               stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path class="js-enter" d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
            <path class="js-exit" d="M3 8h3a2 2 0 0 0 2-2V3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M21 16h-3a2 2 0 0 0-2 2v3" hidden/>
          </svg>
        </button>
      </div>

      <button class="btn btn--icon topbar__settings" id="settingsBtn" title="Settings" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"/>
        </svg>
      </button>
    </header>

    <div class="body">
      <nav class="rail" id="rail" aria-label="Tools" hidden></nav>

      <main class="workspace" id="workspace">
        <!-- Shown the moment a document is handed over, so the wait is not a blank room. -->
        <section class="opening" id="opening" hidden>
          <div class="opening__spinner" aria-hidden="true"></div>
          <p class="opening__label" id="openingLabel">Opening…</p>
        </section>

        <!-- Empty state: the whole surface is a drop target. -->
        <section class="landing" id="landing">
          <h1 class="landing__title">Edit PDF files</h1>
          <p class="landing__sub">Merge, split, compress, convert, sign and protect — all in this one window, and none of it leaves your computer.</p>
          <div class="dropzone" id="dropzone">
            <svg class="dropzone__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8Z"/>
              <path d="M14 3v5h5"/>
            </svg>
            <button class="btn btn--primary btn--big" id="pickBtn">Choose PDF files</button>
            <p class="dropzone__hint">or drop them anywhere on this page</p>
            <p class="dropzone__note">PDFs and images (PNG, JPG) are both welcome.</p>
          </div>
        </section>

        <!-- Working surface -->
        <section class="surface" id="surface" hidden>
          <div class="wsbar" id="wsbar">
            <div class="wsbar__zoom">
              <button class="btn btn--icon" id="zoomOut" aria-label="Zoom out">−</button>
              <span class="wsbar__zoomvalue" id="zoomValue">30%</span>
              <button class="btn btn--icon" id="zoomIn" aria-label="Zoom in">+</button>
            </div>
            <div class="segmented" id="viewToggle" role="tablist">
              <button class="segmented__btn is-active" data-view="pages" role="tab">Pages</button>
              <button class="segmented__btn" data-view="files" role="tab">Files</button>
            </div>
            <span class="wsbar__spacer"></span>
            <span class="wsbar__status" id="selectionStatus"></span>
            <button class="btn btn--ghost" id="selectAllBtn">Select all</button>
            <button class="btn btn--ghost" id="clearSelBtn">Clear</button>
          </div>

          <div class="editorbar" id="editorbar" hidden>
            <button class="btn btn--ghost" id="backToGrid">← All pages</button>
            <span class="editorbar__label" id="editorLabel"></span>
            <span class="wsbar__spacer"></span>
            <button class="btn btn--icon" id="prevPage" aria-label="Previous page"
                    title="Previous page (left arrow)">‹</button>
            <button class="btn btn--icon" id="nextPage" aria-label="Next page"
                    title="Next page (right arrow)">›</button>
          </div>

          <div class="viewerbar" id="viewerbar" hidden>
            <button class="btn btn--ghost" id="viewerToGrid">← All pages</button>
            <label class="pagejump">
              <span class="pagejump__prefix">Page</span>
              <input class="pagejump__input" id="viewerPageInput" type="number" min="1" step="1"
                     aria-label="Go to page" title="Type a page number to jump there">
              <span class="pagejump__total" id="viewerPageTotal">of 1</span>
            </label>
            <span class="wsbar__spacer"></span>
            <button class="btn btn--icon" id="viewerZoomOut" aria-label="Zoom out" title="Zoom out (minus key)">−</button>
            <span class="wsbar__zoomvalue" id="viewerZoom">100%</span>
            <button class="btn btn--icon" id="viewerZoomIn" aria-label="Zoom in" title="Zoom in (plus key)">+</button>
            <button class="btn btn--ghost" id="viewerFit" title="Fit the window (0 key)">Fit</button>
          </div>

          <div class="grid" id="pageGrid"></div>
          <div class="editor" id="editor" hidden></div>
          <div class="viewer" id="viewer" hidden></div>
        </section>
      </main>

      <aside class="panel" id="panel" hidden>
        <header class="panel__head">
          <h2 class="panel__title" id="panelTitle"></h2>
          <p class="panel__blurb" id="panelBlurb"></p>
        </header>
        <div class="panel__body" id="panelBody"></div>
      </aside>
    </div>

    <div class="dropveil" id="dropveil"><span>Drop files to add them</span></div>
  </div>

  <input type="file" id="filePicker" accept="application/pdf,image/png,image/jpeg" multiple hidden>
  <div id="toasts"></div>
  <div id="modalRoot"></div>

  <!-- Above the modules, and classic, so the download starts first. See handover.js. -->
  <script src="handover.js"></script>

  <!-- JSZip only ships a classic build; loading it here keeps the app modules clean. -->
  <script src="../vendor/jszip.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
